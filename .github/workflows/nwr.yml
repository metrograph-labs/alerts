# The decoder check of the weather radio source (AL-185). The job makes the SAME audio of a weekly test, decodes it
# with multimon-ng, and gives the lines to the source. The fetch must give the observation of the header.
# A second step starts the receiver with the real decoder, and a script in the place of the tuner.
# The SDR dongle is not part of the job: the bench test with the dongle is AL-192.
# This file is a gate with paths (CI.md): the job changes gives the match, and the job NWR decoder OK gives the result.
name: NWR decoder

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - packages/source-nwr/**
      - .github/workflows/nwr.yml
  # A person starts a run on a branch with no pull request: gh workflow run nwr.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the run of a pull request. Each commit of main has its own group, so its run ends with a result (main-runs-finish).
concurrency:
  group: nwr-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@a6fe0b4de26f6f9fcc3bc7765dd2bcf141f6da3d # main
        with:
          paths: |
            packages/source-nwr/**
            .github/workflows/nwr.yml

  decode:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # multimon-ng reads a WAV file through sox.
      - name: Install the decoder
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends multimon-ng sox
          multimon-ng -h 2>&1 | head -n 3 || true
      - name: Make the audio of a weekly test
        working-directory: packages/source-nwr
        run: |
          at=$(date -u +%Y-%m-%dT%H:%M:00Z)
          echo "AT=$at" >> "$GITHUB_ENV"
          node scripts/same-fixture.ts wav --at "$at" --out "$RUNNER_TEMP/rwt.wav"
      - name: Decode the WAV file
        run: |
          multimon-ng -t wav -a EAS -v 1 "$RUNNER_TEMP/rwt.wav" | tee "$RUNNER_TEMP/lines.txt"
      - name: Give the lines to the source
        working-directory: packages/source-nwr
        run: node scripts/same-fixture.ts check --at "$AT" --lines "$RUNNER_TEMP/lines.txt"
      - name: Start the receiver with the decoder
        working-directory: packages/source-nwr
        run: node scripts/same-fixture.ts receive --at "$AT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nwr-decoder-lines
          path: ${{ runner.temp }}/lines.txt
          if-no-files-found: warn
          retention-days: 14

  nwr-ok:
    name: NWR decoder OK
    if: ${{ !cancelled() }}
    needs: [changes, decode]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@a6fe0b4de26f6f9fcc3bc7765dd2bcf141f6da3d # main
        with:
          needs: ${{ toJSON(needs) }}
