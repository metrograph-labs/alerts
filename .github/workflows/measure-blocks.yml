# The measure of the blocks of the event loop in a start and in its next passes (AL-115). Each run seeds one log with the
# live cache files. Then it opens the home two times: one start folds the whole log, and the next start reads the snapshot.
# The records give the blocks of each phase, and the time of each write of the snapshot: the rows apart from SQLite. Time on
# a shared computer tells nothing, thus the measure runs in CI only. Five runs give the spread.
#
# The gate holds the work of the snapshot write in the start that folds the whole log (AL-122). Each part of a write between
# two pauses has at most BLOCK_LIMIT_MS of CPU time of the thread. The limit is the worst of 5 runs plus their spread. The
# liveness probe has a time-out of 2000 ms. The wall time of a part also has the waits for the disk and the runner, and
# the gate does not count them. Runs 45022368162 and 45024642861 had parts of 164.7 ms and 276.4 ms with 150 ms of CPU time in each write.
# In the record 45025694491, the worst part had 7.9 ms to 13.5 ms of CPU time. Thus the limit is 13.5 + 5.6, rounded up to 20 ms.
# The gate counts the CPU time of a part apart from the pauses of the garbage collector in it (AL-174). On 2026-11-24 one
# pause gave single parts of 50 to 83 ms, and each rerun passed. The records 45542046475 and 45545323723 give 10 runs of
# this work: 8.6 ms to 20.8 ms, with 0 ms of the collector in the worst part. That runner had 219 ms of CPU time in the
# write, and the other runners had 97 ms to 167 ms. Thus the limit is 20.8 + 12.2, which is 33 ms.
# A study of the start on a small cloud machine is outside this workflow. The input leave adds two starts of a copy that
# leaves sources (AL-160): one folds the whole log for its new snapshot key, and one reads the snapshot of that key.
# This file is a gate with paths (CI.md): the job changes gives the match, and the job Measure blocks OK gives the result.
name: Measure blocks

on:
  # Each pull request starts the workflow. The job changes skips the measure when no file of the gate changes.
  pull_request:
  # A person starts a run of another size: gh workflow run measure-blocks.yml -f size=96 -f passes=4
  workflow_dispatch:
    inputs:
      size:
        description: The size of the log in MB
        default: "192"
      passes:
        description: The count of passes of each start, with the first pass
        default: "4"
      leave:
        description: The source ids with commas that a copy leaves (AL-160). Two more starts open the home as that copy.
        default: ""

permissions:
  contents: read

concurrency:
  group: measure-blocks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@9663f978520a3cd55fe3d5823edb673753d0025a # main
        with:
          paths: |
            packages/runtime/src/**
            packages/testkit/scripts/start-blocks.ts
            packages/testkit/src/seed-*.ts
            pnpm-lock.yaml
            .github/workflows/measure-blocks.yml

  measure:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Measure the blocks of two starts
        working-directory: packages/testkit
        env:
          SIZE: ${{ inputs.size || '192' }}
          PASSES: ${{ inputs.passes || '4' }}
          LEAVE_SOURCES: ${{ inputs.leave || '' }}
          # The longest part of a snapshot write between two pauses, in ms. The script exits with 1 above it, and with 1
          # when the start that folds the whole log has no snapshot write. A run with no record is no read, not a pass.
          BLOCK_LIMIT_MS: "33"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/blocks" "$RUNNER_TEMP/seed"
          node scripts/start-blocks.ts "$RUNNER_TEMP/seed" "$SIZE" "$PASSES" | tee "$GITHUB_WORKSPACE/blocks/records.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: measure-blocks-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.run }}
          path: blocks/
          if-no-files-found: error
          retention-days: 90

  measure-ok:
    name: Measure blocks OK
    if: ${{ !cancelled() }}
    needs: [changes, measure]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@9663f978520a3cd55fe3d5823edb673753d0025a # main
        with:
          needs: ${{ toJSON(needs) }}
