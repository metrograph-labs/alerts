# The measure of the CAP fields of the NWS alerts (AL-31 step 4b). The IEM archive of the VTEC alerts has no CAP
# severity, urgency or certainty, and the NWS API keeps the alerts of about 7 days. So each run reads the days that no
# earlier run read, and adds the counts of each VTEC code to the file of the last run: packages/rates/data/cap.json.
# The requests name no state and no office. Two runs each week keep each window in the days that the API keeps,
# and a run that fails leaves its days to the next run.
# Each run uploads the whole file. The next run adds to it, so the file builds up with no commit.
# A person examines the file and commits it from the artifact with the base rates.
# Each run also gives the replay of the table and the score over the file, with the committed base rates and priors.
name: CAP fields

on:
  schedule:
    - cron: "29 7 * * 1,4"
  # A person starts a run with gh workflow run cap.yml.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cap-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the file of the last run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cap.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$id" ]; then echo "No earlier run: the measure adds to the committed file."; exit 0; fi
          gh run download "$id" --repo "$GITHUB_REPOSITORY" --name cap --dir "$RUNNER_TEMP/last" || echo "::warning title=No file of the last run::The run $id has no artifact cap. The measure adds to the committed file."
      - name: Measure the CAP fields
        working-directory: packages/rates
        run: node scripts/measure-cap.ts --committed=data/cap.json --last="$RUNNER_TEMP/last/cap.json" --rates=data/rates.json --priors=../core/src/data/priors.json --out="$GITHUB_WORKSPACE/cap"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cap
          path: cap/
          if-no-files-found: warn
          retention-days: 90
